<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ditch Tracker & Mini-Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    #menu-view {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #f0f6fc;
    }

    .launch-btn {
      background-color: #9146ff;
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(145, 70, 255, 0.4);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .launch-btn:hover {
      background-color: #772ce8;
      transform: scale(1.05);
    }

    /* Embedded Game Container */
    #game-wrapper {
      display: none;
      width: 100%;
      max-width: 450px;
      height: 700px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Main Menu Area -->
  <div id="menu-view">
    <h1>Ditch Tracker</h1>
    <button id="launch-btn" class="launch-btn">Play Red Light, Green Light 🎮</button>
  </div>

  <!-- Game Container -->
  <div id="game-wrapper">
    <iframe id="game-frame" src="about:blank"></iframe>
  </div>

  <script>
    const menuView = document.getElementById('menu-view');
    const launchBtn = document.getElementById('launch-btn');
    const gameWrapper = document.getElementById('game-wrapper');
    const gameFrame = document.getElementById('game-frame');

    launchBtn.addEventListener('click', () => {
      // 1. Hide the menu and display the game frame
      menuView.style.display = 'none';
      gameWrapper.style.display = 'block';

      // 2. Load game.html into the iframe (inherits click gesture context)
      gameFrame.src = 'game.html';
    });
  </script>

</body>
</html>
