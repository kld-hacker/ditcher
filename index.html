<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppseez Ditch Tracker</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      
      --color-empty: #161b22;
      --color-off: #21262d;
      --color-streamed: #238636;
      --color-ditched: #da3633;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }

    .container {
      max-width: 850px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #58a6ff;
      margin-top: 0.4rem;
    }

    .tracker-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.5rem;
      overflow-x: auto;
    }

    .heatmap-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 650px;
    }

    .months-header {
      display: flex;
      margin-left: 32px;
      font-size: 0.75rem;
      color: var(--text-muted);
      height: 16px;
      position: relative;
    }

    .month-label {
      position: absolute;
    }

    .heatmap-body {
      display: flex;
      gap: 8px;
    }

    .days-column {
      display: grid;
      grid-template-rows: repeat(7, 12px);
      gap: 4px;
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 12px;
    }

    .grid-container {
      display: grid;
      grid-template-rows: repeat(7, 12px);
      grid-auto-flow: column;
      grid-auto-columns: 12px;
      gap: 4px;
    }

    .day-cell {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background-color: var(--color-empty);
      outline: 1px solid rgba(255, 255, 255, 0.05);
    }

    .day-cell[data-status="streamed"] { background-color: var(--color-streamed); }
    .day-cell[data-status="ditched"] { background-color: var(--color-ditched); }
    .day-cell[data-status="off"] { background-color: var(--color-off); }

    .legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .legend-box {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Peppseez Ditch Tracker</h1>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Ditches</div>
      <div class="stat-value" id="total-ditches" style="color: var(--color-ditched);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Streams</div>
      <div class="stat-value" id="total-streams" style="color: var(--color-streamed);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Stream Rate</div>
      <div class="stat-value" id="success-rate">0%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Current Ditch Streak</div>
      <div class="stat-value" id="current-streak">0 days</div>
    </div>
  </div>

  <div class="tracker-card">
    <div class="heatmap-wrapper">
      <div class="months-header" id="months-header"></div>
      <div class="heatmap-body">
        <div class="days-column">
          <span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span>
        </div>
        <div class="grid-container" id="heatmap-grid"></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-box" style="background: var(--color-off);"></div> Off</div>
      <div class="legend-item"><div class="legend-box" style="background: var(--color-streamed);"></div> Streamed</div>
      <div class="legend-item"><div class="legend-box" style="background: var(--color-ditched);"></div> Ditched</div>
    </div>
  </div>
</div>

<script>
  async function initTracker() {
    try {
      const response = await fetch('streams.json');
      const streamData = await response.json();

      const grid = document.getElementById('heatmap-grid');
      const monthsHeader = document.getElementById('months-header');
      
      const numWeeks = 18; // Number of weeks shown in graph
      const today = new Date();
      
      // Calculate start date by going back `numWeeks` and aligning to Sunday (index 0)
      const todayDayOfWeek = today.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat
      const startDate = new Date(today);
      startDate.setDate(today.getDate() - ((numWeeks - 1) * 7 + todayDayOfWeek));

      let totalStreams = 0;
      let totalDitches = 0;
      let currentStreak = 0;
      let countingStreak = true;

      let lastMonth = -1;
      let colIndex = 0;

      // Iterate forward day by day from start date to today
      const currentDate = new Date(startDate);
      
      // Temporary storage for reverse calculations of streak
      const dateList = [];

      while (currentDate <= today) {
        const year = currentDate.getFullYear();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        const day = String(currentDate.getDate()).padStart(2, '0');
        const dateString = `${year}-${month}-${day}`;

        // Add month label when crossing into a new month
        if (currentDate.getDay() === 0) { // Check on Sundays (start of new column)
          const currentMonth = currentDate.getMonth();
          if (currentMonth !== lastMonth) {
            const monthLabel = document.createElement('span');
            monthLabel.classList.add('month-label');
            monthLabel.textContent = currentDate.toLocaleString('default', { month: 'short' });
            monthLabel.style.left = `${colIndex * 16}px`; // 12px cell + 4px gap
            monthsHeader.appendChild(monthLabel);
            lastMonth = currentMonth;
          }
          colIndex++;
        }

        const cell = document.createElement('div');
        cell.classList.add('day-cell');
        
        const status = streamData[dateString] || 'empty';
        if (status !== 'empty') {
          cell.setAttribute('data-status', status);
        }
        
        cell.title = `${dateString}: ${status}`;
        grid.appendChild(cell);

        if (status === 'streamed') totalStreams++;
        if (status === 'ditched') totalDitches++;

        dateList.push({ dateString, status });

        // Advance by 1 day
        currentDate.setDate(currentDate.getDate() + 1);
      }

      // Calculate Current Ditch Streak backwards starting from today
      for (let i = dateList.length - 1; i >= 0; i--) {
        const status = dateList[i].status;
        if (status === 'ditched') {
          currentStreak++;
        } else if (status === 'streamed') {
          break; // Stop when hitting a streamed day
        }
      }

      const totalPromised = totalStreams + totalDitches;
      const rate = totalPromised > 0 ? Math.round((totalStreams / totalPromised) * 100) : 100;
      
      document.getElementById('total-ditches').textContent = totalDitches;
      document.getElementById('total-streams').textContent = totalStreams;
      document.getElementById('success-rate').textContent = `${rate}%`;
      document.getElementById('current-streak').textContent = `${currentStreak} d`;

    } catch (error) {
      console.error('Error loading stream data:', error);
    }
  }

  initTracker();
</script>

</body>
</html>
