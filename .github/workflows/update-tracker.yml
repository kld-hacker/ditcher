name: Auto-Update Twitch Tracker Data

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-size: '3.x'

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Run Scraper
        run: python update_streams.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update stream data from TwitchTracker"
          git push
