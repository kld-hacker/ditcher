name: Auto-Update Twitch Tracker Data

on:
  schedule:
    # Runs twice a day (at 12:00 UTC and 23:00 UTC) to catch streams
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI anytime

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tracker Update
        run: python update_streams.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update stream status"
          git push
