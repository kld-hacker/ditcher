name: Check Live Stream Status

on:
  schedule:
    # Runs hourly at 15:00, 16:00, 17:00, and 18:00 UTC
    # (17:00, 18:00, 19:00, and 20:00 Italian time CEST)
    - cron: '0 15-18 * * *'
  workflow_dispatch: # Allows manual triggers anytime from GitHub UI

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Stream Checker
        run: python update_streams.py

      - name: Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git diff-index --quiet HEAD || git commit -m "Auto-update stream status"
          git push
